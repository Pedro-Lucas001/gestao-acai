# Local development only. Passwords come from .local/compose.env, generated by npm run setup.
name: netuno-acai-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: netuno
      POSTGRES_DB: gestao_acai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netuno -d gestao_acai"]
      interval: 2s
      timeout: 5s
      retries: 30
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    volumes:
      - azurite_data:/data
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.local
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      POSTGRESQL_CONNECTION_STRING: Host=postgres;Port=5432;Database=gestao_acai;Username=netuno;Password=${POSTGRES_PASSWORD:?Execute npm run setup}
      # Public Azurite emulator key, not an Azure account credential.
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1
    ports:
      - "127.0.0.1:7071:80"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
volumes:
  postgres_data:
  azurite_data:
